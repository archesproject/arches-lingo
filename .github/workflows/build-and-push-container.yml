# Build and Push Container Image
#
# Triggered by pushing to a deploy branch: deploy/<environment>
# The branch suffix must match a GitHub Environment configured on this repo.
#
# Each GitHub Environment requires the following variables:
#   ECR_REPOSITORY  - e.g. mysite-repository
#   AWS_ROLE    - e.g. arn:aws:iam::123456789012:role/my-github-role
#   AWS_REGION    - e.g. us-west-1
#
# The following must be set as repository-level variables (not environment-scoped):
#   ARCHES_PROJECT      - e.g. arches-myproject
#   ARCHES_PROJECT_PACKAGE  - e.g. arches_myproject
#   ARCHES_DOCKER_REF   - e.g. v1.0.0
#
# ARCHES_DOCKER_REF pins the arches-docker release this project builds against.
# It must be an immutable ref — a release tag (vX.Y.Z) or a full 40-char commit
# SHA. Branch names are rejected: floating on a branch means an unrelated push
# to arches-docker can change or break this build, and that the same project
# commit no longer produces the same image. To adopt a new arches-docker
# release, bump this variable deliberately (see arches-docker UPGRADING.md).
#
# And a repository secret:
#   FARGEO_PAT  - GitHub PAT with read access to fargeo/arches-docker

name: Build and Push Container Image

on:
  push:
    branches:
      - "deploy/*"

permissions:
  id-token: write
  contents: read

jobs:
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.name }}
      arches_docker_ref: ${{ steps.infra.outputs.ref }}
    steps:
      - name: Extract environment from branch
        id: env
        run: echo "name=${GITHUB_REF_NAME#deploy/}" >> $GITHUB_OUTPUT

      # Validate the arches-docker pin here, before any build job starts, so a
      # missing or floating ref fails once and fast rather than once per arch.
      # An unset variable is especially dangerous to pass through: actions/checkout
      # treats an empty `ref` as "use the default branch", which would silently
      # restore the floating-on-main behaviour this pin exists to prevent.
      - name: Resolve and validate arches-docker ref
        id: infra
        env:
          ARCHES_DOCKER_REF: ${{ vars.ARCHES_DOCKER_REF }}
        run: |
          if [ -z "${ARCHES_DOCKER_REF}" ]; then
            echo "::error::ARCHES_DOCKER_REF repository variable is not set. Pin an immutable arches-docker release tag (e.g. v1.0.0). See arches-docker UPGRADING.md."
            exit 1
          fi
          if [[ ! "${ARCHES_DOCKER_REF}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
             && [[ ! "${ARCHES_DOCKER_REF}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ARCHES_DOCKER_REF is '${ARCHES_DOCKER_REF}', which is not an immutable ref. Use a release tag (vX.Y.Z) or a full 40-character commit SHA — not a branch name."
            exit 1
          fi
          echo "Building against arches-docker ${ARCHES_DOCKER_REF}"
          echo "ref=${ARCHES_DOCKER_REF}" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.slug }})
    needs: setup
    runs-on: ${{ matrix.runner }}
    environment: ${{ needs.setup.outputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            slug: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: arm64
    steps:
      - name: Checkout project
        uses: actions/checkout@v5
        with:
          path: project

      - name: Checkout arches-docker
        uses: actions/checkout@v5
        with:
          repository: fargeo/arches-docker
          ref: ${{ needs.setup.outputs.arches_docker_ref }}
          token: ${{ secrets.FARGEO_PAT }}
          path: arches-docker

      - name: Prepare build context
        run: |
          mkdir -p project/.runtime
          cp arches-docker/entrypoint.sh project/.runtime/entrypoint.sh
          cp arches-docker/supervisor.conf project/.runtime/supervisor.conf
          cp arches-docker/settings_local.py project/.runtime/settings_local.py
          cp -r arches-docker/conf.d project/.runtime/
          cp -r arches-docker/nginx project/.runtime/
          cp -r arches-docker/scaffold/templates/.runtime/internal project/.runtime/
          # build_deps.sh is project-owned and required by the Dockerfile COPY —
          # create it if this project hasn't scaffolded one yet, but never
          # overwrite an existing (committed) one.
          mkdir -p project/.runtime/hooks
          [ -f project/.runtime/hooks/build_deps.sh ] || cp arches-docker/scaffold/templates/.runtime/hooks/build_deps.sh project/.runtime/hooks/build_deps.sh
          chmod +x project/.runtime/hooks/build_deps.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./project
          file: arches-docker/production/Dockerfile.alpine
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:cache-${{ matrix.slug }}
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:cache-${{ matrix.slug }},mode=max
          build-args: |
            ARCHES_PROJECT=${{ vars.ARCHES_PROJECT }}
            ARCHES_PROJECT_PACKAGE=${{ vars.ARCHES_PROJECT_PACKAGE }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifests
    runs-on: ubuntu-latest
    needs: [setup, build]
    environment: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create and push manifest list
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ needs.setup.outputs.environment }}-${{ github.sha }}
        run: |
          REPO="${ECR_REGISTRY}/${{ vars.ECR_REPOSITORY }}"
          docker buildx imagetools create \
          -t "${REPO}:${IMAGE_TAG}" \
          $(printf "${REPO}@sha256:%s " $(ls /tmp/digests/))
